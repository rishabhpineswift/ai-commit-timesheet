name: "AI Commit Timesheet"
description: "Logs a per-push timesheet entry (who, when, lines changed, AI code-review summary) to a CSV file in the repo, and optionally to a central cross-project timesheet-data repo."
author: "rishabhpineswift"

inputs:
  claude-oauth-token:
    description: "Claude Code OAuth token (from `claude setup-token`, tied to a Claude subscription/Team seat). If omitted, falls back to using the raw commit message as the summary."
    required: false
  timesheet-path:
    description: "Path (relative to repo root) of the CSV file to append to."
    required: false
    default: "timesheet.csv"
  commit-and-push:
    description: "Whether the action should commit a per-repo timesheet.csv and push it back to this repo. Off by default — with central-repo set, that CSV is redundant clutter in every consuming repo; turn this on only if you want a local copy and have no central-repo."
    required: false
    default: "false"
  git-user-name:
    description: "Git author name used for the automated commit."
    required: false
    default: "ai-commit-timesheet-bot"
  git-user-email:
    description: "Git author email used for the automated commit."
    required: false
    default: "ai-commit-timesheet-bot@users.noreply.github.com"
  central-repo:
    description: "owner/repo of a central timesheet-data repo to also publish per-project daily and per-contributor monthly rollups into. Leave empty to skip."
    required: false
  central-repo-token:
    description: "Fine-grained PAT with contents:write on central-repo. Required if central-repo is set (the default GITHUB_TOKEN can't write to a different repo)."
    required: false
  project-name:
    description: "Project name used as the folder key under projects/ in central-repo. Defaults to the current repo's name."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install Claude Code CLI
      if: ${{ inputs.claude-oauth-token != '' }}
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    - name: Generate timesheet entry
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-oauth-token }}
        TIMESHEET_PATH: ${{ inputs.timesheet-path }}
        BEFORE_SHA: ${{ github.event.before }}
        AFTER_SHA: ${{ github.event.after }}
        BRANCH_NAME: ${{ github.ref_name }}
      run: ${{ github.action_path }}/scripts/generate-entry.sh

    - name: Publish to central timesheet repo
      if: ${{ inputs.central-repo != '' }}
      shell: bash
      env:
        CENTRAL_REPO: ${{ inputs.central-repo }}
        CENTRAL_REPO_TOKEN: ${{ inputs.central-repo-token }}
        PROJECT_NAME: ${{ inputs.project-name != '' && inputs.project-name || github.event.repository.name }}
      run: ${{ github.action_path }}/scripts/publish-central.sh

    - name: Commit and push timesheet
      if: ${{ inputs.commit-and-push == 'true' }}
      shell: bash
      run: |
        if [ -z "$(git status --porcelain -- "${{ inputs.timesheet-path }}")" ]; then
          echo "No timesheet changes to commit."
          exit 0
        fi
        git config user.name "${{ inputs.git-user-name }}"
        git config user.email "${{ inputs.git-user-email }}"
        git add "${{ inputs.timesheet-path }}"
        git commit -m "chore: update timesheet [skip ci]"
        branch="${{ github.ref_name }}"
        for attempt in 1 2 3 4 5; do
          if git push origin "HEAD:$branch"; then
            exit 0
          fi
          echo "Push rejected (attempt $attempt) — another run likely pushed first. Rebasing and retrying..."
          sleep $((RANDOM % 5 + 1))
          git fetch origin "$branch"
          git rebase "origin/$branch"
        done
        echo "Failed to push timesheet after retries."
        exit 1
